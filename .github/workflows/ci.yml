name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install libgpiod build requirements
        run: sudo apt-get update && sudo apt-get install -y libgpiod-dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native GPIO binding
        run: |
          if ! node -e "require('node-libgpiod')"; then
            echo "Native dependency installation log:"
            latest_log=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log | head -1)
            tail -300 "$latest_log"
            build_dir=$(mktemp -d)
            curl -sSL "https://github.com/adrianmihai83/node-libgpiod/archive/6e58a6aaf942046d61a45e0c4cb1270fc182464c.tar.gz" \
              | tar -xz -C "$build_dir" --strip-components=1
            npm install --prefix "$build_dir" --foreground-scripts
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run
