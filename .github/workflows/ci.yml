name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install libgpiod build requirements
        run: sudo apt-get update && sudo apt-get install -y libgpiod-dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native GPIO binding
        run: node -e "require('node-libgpiod')"

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run
